[package]
name = "rotascope_server2"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
time = "0.3"

# H.264 encoding
openh264 = "0.9"

# QUIC transport
quinn = "0.10"
rustls = "0.21"
rcgen = "0.14"

# Windows-only dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_Foundation",
] }

[profile.release]
strip = true
lto = true
panic = "abort"
opt-level = "z"
codegen-units = 1
