[package]
name = "rotascope_server2"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"

# Windows API
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D9", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D"] }
dxgi = { version = "0.3.0-alpha4" }  # Windows屏幕捕获
x11rb = "0.10.1" # Linux屏幕捕获，需要安装x11开发库
# 编码库（这里用软编示例，硬编需要额外SDK）
openh264 = "0.9"
clap = { version = "4.5.53", features = ["derive"] }
rustls = "0.21.12"
rcgen = "0.14.6"
time = "0.3.44"


[build-dependencies]
cc = "1"
[profile.release]
strip = true
lto = true
panic = "abort"
opt-level = "z"
codegen-units = 1

## pacman -S glib2-devel pkg-confi mingw-w64-x86_64-gstreamer mingw-w64-x86_64-gst-plugins-bas mingw-w64-x86_64-gst-plugins-good mingw-w64-x86_64-gst-pugins-bad mingw-w64-x86_64-gst-plugins-ugly mingw-w64-x86_64-gst-libav mingw-w64-x86_64-gst-rtsp-quic_server