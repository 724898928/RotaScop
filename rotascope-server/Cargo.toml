[package]
name = "rotascope-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
warp = { version = "0.3", features = ["websocket"] }
futures = "0.3"
xcap = "0.2"          # 屏幕捕获（跨平台）
image = "0.24"        # 图像处理与 JPEG 编码
anyhow = "1.0"
bytes = "1.4"
env_logger = "0.10"
log = "0.4"


[profile.release]
strip = true
lto = true
panic = "abort"
opt-level = "z"
codegen-units = 1